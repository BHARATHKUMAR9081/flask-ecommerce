name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  AWS_REGION: ap-south-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/flask-ecommerce
  INSTANCE_ID: i-0a53afb72f5840266
  PUBLIC_URL: http://13.204.51.212
  SECRETS_MANAGER_ID: deptic/flask-ecommerce/secrets
  CONTAINER_PORT: "5000"

jobs:
  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: python -m unittest discover -s tests -t .

  build-and-push:
    name: Build image and push to ECR
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13 (build diagnostics)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build diagnostics - compile all Python sources
        run: python -m compileall -q run.py shop tests

      - name: Build diagnostics - import app factory and print version
        run: |
          python - <<'PY'
          import shop
          from shop import create_app
          app = create_app({"TESTING": True})
          print("ShopSphere", shop.__version__, "- app factory OK")
          print("Registered blueprints:", sorted(app.blueprints.keys()))
          PY

      - name: Compute image tag
        id: meta
        run: |
          IMAGE_TAG="$(git rev-parse --short HEAD)-$(date -u +%Y%m%d%H%M%S)"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"

      - name: Generate Dockerfile (repository has none)
        run: |
          cat > Dockerfile <<'DOCKERFILE'
          FROM python:3.13-slim
          WORKDIR /app
          ENV PYTHONDONTWRITEBYTECODE=1 PYTHONUNBUFFERED=1
          COPY requirements.txt ./
          RUN pip install --no-cache-dir -r requirements.txt
          COPY run.py ./
          COPY shop ./shop
          EXPOSE 5000
          CMD ["python", "run.py"]
          DOCKERFILE

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Amazon ECR (AWS CLI, static credentials)
        run: |
          ECR_REGISTRY="${ECR_REPOSITORY_URI%/*}"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build container image
        run: |
          docker build -t flask-ecommerce:"${IMAGE_TAG}" -t flask-ecommerce:latest .

      - name: Smoke-test container locally before pushing
        run: |
          docker run -d --name smoke \
            -p 5000:5000 \
            -e SHOP_HOST=0.0.0.0 \
            -e SHOP_PORT=5000 \
            flask-ecommerce:"${IMAGE_TAG}"
          for i in $(seq 1 30); do
            CODE="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5000/ || true)"
            [ "$CODE" = "200" ] && break
            sleep 2
          done
          docker logs smoke
          docker rm -f smoke
          if [ "$CODE" != "200" ]; then
            echo "Container smoke test failed with HTTP ${CODE}"
            exit 1
          fi
          echo "Container smoke test passed with HTTP ${CODE}"

      - name: Tag and push image to ECR
        run: |
          docker tag flask-ecommerce:"${IMAGE_TAG}" "${ECR_REPOSITORY_URI}:${IMAGE_TAG}"
          docker tag flask-ecommerce:"${IMAGE_TAG}" "${ECR_REPOSITORY_URI}:latest"
          docker push "${ECR_REPOSITORY_URI}:${IMAGE_TAG}"
          docker push "${ECR_REPOSITORY_URI}:latest"

  deploy:
    name: Deploy to EC2 via SSM
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Write SSM command payload to JSON file
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "set -e",
              "REGION=ap-south-1",
              "IMAGE_URI=759204735992.dkr.ecr.ap-south-1.amazonaws.com/flask-ecommerce:${IMAGE_TAG}",
              "ECR_REGISTRY=759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id deptic/flask-ecommerce/secrets --region $REGION --query SecretString --output text)",
              "SHOP_SECRET_KEY=$(echo \"$SECRET_JSON\" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get(\"SHOP_SECRET_KEY\",\"\"))')",
              "SHOP_ADMIN_PASSWORD=$(echo \"$SECRET_JSON\" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get(\"SHOP_ADMIN_PASSWORD\",\"\"))')",
              "SHOP_SMTP_PASSWORD=$(echo \"$SECRET_JSON\" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get(\"SHOP_SMTP_PASSWORD\",\"\"))')",
              "docker run -d --restart always --name app -p 80:5000 -e SHOP_HOST=0.0.0.0 -e SHOP_PORT=5000 -e SHOP_SECRET_KEY=\"$SHOP_SECRET_KEY\" -e SHOP_ADMIN_PASSWORD=\"$SHOP_ADMIN_PASSWORD\" -e SHOP_SMTP_PASSWORD=\"$SHOP_SMTP_PASSWORD\" $IMAGE_URI"
            ]
          }
          SSMPARAMS
          sed -i "s|\${IMAGE_TAG}|${IMAGE_TAG}|g" /tmp/ssm-params.json
          echo "Payload written:"
          cat /tmp/ssm-params.json

      - name: Send SSM command to EC2 instance
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)
          echo "COMMAND_ID=${COMMAND_ID}" >> "$GITHUB_ENV"
          echo "Dispatched SSM command ${COMMAND_ID}"

      - name: Wait for SSM command completion
        run: |
          STATUS=""
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "Status" --output text || echo "Pending")
            echo "SSM status: ${STATUS}"
            case "$STATUS" in
              Success) break ;;
              InProgress|Pending|Delayed) sleep 5 ;;
              *) echo "SSM command failed with status ${STATUS}"; exit 1 ;;
            esac
          done
          if [ "$STATUS" != "Success" ]; then
            echo "SSM command did not succeed in time (last: ${STATUS})"
            exit 1
          fi
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query "StandardOutputContent" --output text

  verify:
    name: Verify production health
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Health check public URL (HTTP 200 required)
        run: |
          for i in $(seq 1 30); do
            CODE="$(curl -s -o /dev/null -w '%{http_code}' "${PUBLIC_URL}/" || true)"
            echo "Attempt ${i}: HTTP ${CODE}"
            [ "$CODE" = "200" ] && break
            sleep 5
          done
          if [ "$CODE" != "200" ]; then
            echo "Health check failed: expected HTTP 200, got ${CODE}"
            exit 1
          fi
          echo "Health check passed: ${PUBLIC_URL}/ returned HTTP 200"